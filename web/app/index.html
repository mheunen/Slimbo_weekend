<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spellenweekend</title>
<meta name="theme-color" content="#2e6b4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Spellenweekend">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
  :root {
    --bg: #f8f6f0; --surface: #ffffff; --surface2: #eeede5; --text: #1b1d1a; --muted: #5d625b; --line: #dcdcd2;
    --brand: #2e6b4f; --brand-ink: #fff; --brand-soft: #cbe9d7; --accent: #a86f12; --accent-soft: #ffe2b0;
    --warn: #b3261e; --green: #2e9d5b; --amber: #e0a21b; --red: #d0453c; --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121512; --surface: #1c201c; --surface2: #262a26; --text: #e6e8e3; --muted: #a3a9a1; --line: #343a35;
      --brand: #8fd3ae; --brand-ink: #003822; --brand-soft: #175239; --accent: #f2be5e; --accent-soft: #5e4100; --warn: #ffb4ab;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding-bottom: calc(72px + env(safe-area-inset-bottom)); }
  header { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); padding: calc(10px + env(safe-area-inset-top)) 16px 10px; display: flex; align-items: center; gap: 10px; }
  header .logo { background: #fff; border-radius: 8px; padding: 3px 8px; display: inline-flex; }
  header .logo img { height: 22px; display: block; }
  header h1 { font-size: 16px; margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  main { max-width: 720px; margin: 0 auto; padding: 12px 16px; }
  nav.tabs { position: fixed; bottom: 0; left: 0; right: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); display: flex; padding-bottom: env(safe-area-inset-bottom); }
  nav.tabs button { flex: 1; background: none; border: 0; padding: 8px 2px 10px; color: var(--muted); font: inherit; font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 2px; position: relative; cursor: pointer; }
  nav.tabs button .ic { font-size: 20px; line-height: 1; }
  nav.tabs button.on { color: var(--brand); font-weight: 600; }
  nav.tabs .badge { position: absolute; top: 4px; left: calc(50% + 6px); background: var(--red); color: #fff; border-radius: 999px; font-size: 11px; padding: 0 5px; }
  h2 { font-size: 14px; color: var(--brand); margin: 20px 0 8px; font-weight: 700; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; }
  .card.invite { background: var(--accent-soft); }
  .card.running { background: var(--brand-soft); }
  .muted { color: var(--muted); font-size: 14px; }
  .small { font-size: 13px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; }
  .title { font-weight: 650; font-size: 17px; }
  button.btn { background: var(--brand); color: var(--brand-ink); border: 0; border-radius: 999px; padding: 9px 16px; font: inherit; font-weight: 600; cursor: pointer; }
  button.btn.tonal { background: var(--brand-soft); color: var(--text); }
  button.btn.ghost { background: transparent; color: var(--brand); border: 1px solid var(--line); }
  button.btn.text { background: transparent; color: var(--brand); padding: 9px 8px; }
  button.btn.danger { background: transparent; color: var(--warn); border: 1px solid var(--line); }
  button.btn:disabled { opacity: .5; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 14px; cursor: pointer; }
  .chip.on { background: var(--brand-soft); border-color: transparent; font-weight: 600; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
  .pill { display: inline-flex; align-items: center; gap: 6px; background: var(--surface2); border-radius: 999px; padding: 4px 10px; font-size: 14px; margin: 0 4px 6px 0; }
  input, select, textarea { font: inherit; font-size: 16px; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; }
  textarea { min-height: 70px; }
  label.f { display: block; margin-bottom: 10px; }
  label.f > span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
  .heart { background: none; border: 0; font-size: 24px; cursor: pointer; padding: 4px 6px; color: var(--muted); }
  .heart.on { color: var(--accent); }
  .warn { color: var(--warn); }
  a { color: var(--brand); }
  dialog { border: 0; padding: 0; width: 100%; max-width: 640px; max-height: 100%; height: 100%; margin: 0 auto; background: var(--bg); color: var(--text); }
  @media (min-width: 700px) { dialog { height: auto; max-height: 90vh; border-radius: var(--radius); margin: auto; } }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog .dhead { position: sticky; top: 0; background: var(--surface); border-bottom: 1px solid var(--line); padding: calc(10px + env(safe-area-inset-top)) 12px 10px; display: flex; align-items: center; gap: 8px; z-index: 2; }
  dialog .dhead h3 { margin: 0; flex: 1; font-size: 17px; }
  dialog .dbody { padding: 14px 16px 40px; }
  .check { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .check input { width: 20px; height: 20px; flex: none; }
  #toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; max-width: calc(100vw - 32px); }
  #toast.show { opacity: 1; }
  .center { text-align: center; }
  .login { max-width: 420px; margin: 30px auto; }
  .login .logo { background: #fff; border-radius: 10px; padding: 10px; display: flex; justify-content: center; margin-bottom: 16px; }
  .login .logo img { height: 52px; }
  .list-item { padding: 10px 12px; border-radius: 10px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
  .list-item.sel { background: var(--brand-soft); font-weight: 600; }
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>
<div id="toast"></div>
<script src="../config.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, collection, doc, getDoc, getDocs, setDoc, addDoc, updateDoc, deleteDoc, query, where, limit,
  onSnapshot, writeBatch, arrayUnion, arrayRemove
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ================================================================== basis
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
};
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 3200); }
const now = () => Date.now();

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

if (!window.FIREBASE_CONFIG || !window.FIREBASE_CONFIG.apiKey) {
  $("#app").innerHTML = `<main><div class="card">De app kan nu geen verbinding maken. Probeer het later opnieuw.</div></main>`;
  throw new Error("geen config");
}
const fb = initializeApp(window.FIREBASE_CONFIG);
const auth = getAuth(fb);
const db = getFirestore(fb);

const S = {
  uid: null, eventId: store.get("app_eventId"), event: null, tab: store.get("app_tab") || "nu",
  members: [], games: [], places: [], tables: [], activities: [], rooms: [], guests: [], chores: [],
  loaded: new Set(), unsub: [],
  ui: { plMine: false, plDone: false, gq: "", gWant: false, gMine: false, gWish: false, gPlayers: 0, gWeights: [], gCat: "", gOwner: "", gFilters: false, claimQ: "", claimSel: "" },
};
const col = (n) => collection(db, "events", S.eventId, n);
const ref = (n, id) => doc(db, "events", S.eventId, n, id);

// ================================================================== labels & formattering
const STATUS = { BESCHIKBAAR: ["Beschikbaar", "var(--green)"], RESERVEERBAAR: ["Reserveerbaar", "var(--amber)"], BEZET: ["Bezet", "var(--red)"] };
const TYPES = { SPEL: ["Spel", "🎲"], ETEN: ["Eten", "🍽️"], WANDELEN: ["Wandelen", "🚶"], ANDERS: ["Anders", "🎉"] };
const ASTATUS = { GEPLAND: "Gepland", GESTART: "Bezig", AFGEROND: "Afgerond", GEANNULEERD: "Geannuleerd" };
const WEIGHTS = { LICHT: "Licht", MIDDEL: "Middel", ZWAAR: "Zwaar" };
const CATEGORIES = ["Strategie", "Familie", "Party", "Thematisch", "Kaartspel", "Abstract", "Coöperatief", "Kinderen", "Oorlog", "Overig"];
const dot = (s) => `<span class="dot" style="background:${(STATUS[s] || STATUS.BESCHIKBAAR)[1]}"></span>`;
const startOfDay = (ms) => { const d = new Date(ms); d.setHours(0, 0, 0, 0); return d.getTime(); };
const fmtTime = (ms) => new Date(ms).toLocaleTimeString("nl-NL", { hour: "2-digit", minute: "2-digit" });
function dayLabel(ms) {
  const diff = Math.round((startOfDay(ms) - startOfDay(now())) / 86400000);
  if (diff === 0) return "Vandaag"; if (diff === 1) return "Morgen"; if (diff === -1) return "Gisteren";
  return new Date(ms).toLocaleDateString("nl-NL", { weekday: "short", day: "numeric" });
}
function dayHeader(ms) {
  const diff = Math.round((startOfDay(ms) - startOfDay(now())) / 86400000);
  const base = new Date(ms).toLocaleDateString("nl-NL", { weekday: "long", day: "numeric", month: "long" });
  return (diff === 0 ? "Vandaag · " : diff === 1 ? "Morgen · " : "") + base.charAt(0).toUpperCase() + base.slice(1);
}
const roundedNow = () => { const q = 15 * 60000; return Math.ceil(now() / q) * q; };
const endAt = (a) => (a.startAt || 0) + (a.durationMin || 60) * 60000;
const isOpen = (a) => a.status === "GEPLAND" || a.status === "GESTART" || !a.status;
const isFull = (a) => (a.maxParticipants || 0) > 0 && (a.participants || []).length >= a.maxParticipants;
const visibleMembers = () => S.members.filter((m) => !m.web && !m.hidden);
const member = (id) => S.members.find((m) => m.id === id);
const nameOf = (id) => member(id)?.name || "Onbekend";
const names = (ids) => (ids || []).map(nameOf).join(", ");
const me = () => member(S.uid);
const myGuest = () => S.guests.find((g) => g.id === me()?.guestId);
const myName = () => myGuest()?.name || me()?.name || "";
function whereText(a) {
  const t = S.tables.find((x) => x.id === a.tableId);
  const p = S.places.find((x) => x.id === (t?.placeId || a.placeId));
  return [t?.name, p?.name].filter(Boolean).join(" · ");
}
const placeName = (id) => S.places.find((p) => p.id === id)?.name || "";
const choreTimes = (c) => c.startAt && c.endAt > c.startAt ? `${fmtTime(c.startAt)}–${fmtTime(c.endAt)}`
  : ({ ochtend: "tot 13:00", middag: "13:00–18:00", avond: "vanaf 18:00" }[c.slot] || "");

// ================================================================== schrijfacties (zelfde als de Android-app)
async function act(fn, ok) { try { await fn(); if (ok) toast(ok); } catch (e) { toast("Mislukt: " + e.message); } }
const upd = (a, extra) => updateDoc(ref("activities", a.id), { ...extra, updatedBy: S.uid, updatedAt: now() });
const A = {
  setStatus: (status, note) => act(() => updateDoc(ref("members", S.uid), { status, statusNote: (note || "").trim(), updatedAt: now() })),
  setWant: (gid, want) => act(() => updateDoc(ref("members", S.uid), { wants: want ? arrayUnion(gid) : arrayRemove(gid) })),
  join: (a) => act(() => upd(a, { participants: arrayUnion(S.uid), invited: arrayRemove(S.uid), declined: arrayRemove(S.uid) })),
  leave: (a) => act(() => upd(a, { participants: arrayRemove(S.uid) })),
  respond: (a, yes) => act(() => upd(a, { invited: arrayRemove(S.uid), [yes ? "participants" : "declined"]: arrayUnion(S.uid) })),
  remove: (a) => act(() => deleteDoc(ref("activities", a.id)), "Verwijderd"),
  async setActStatus(a, status) {
    await act(async () => {
      const b = writeBatch(db);
      b.update(ref("activities", a.id), { status, updatedBy: S.uid, updatedAt: now() });
      if (status === "GESTART") (a.participants || []).forEach((p) => b.update(ref("members", p), { status: "BEZET", statusNote: a.title, updatedAt: now() }));
      else if (a.status === "GESTART") (a.participants || []).forEach((p) => b.update(ref("members", p), { status: "BESCHIKBAAR", statusNote: "", updatedAt: now() }));
      await b.commit();
    });
  },
  async saveActivity(a, isNew) {
    await act(async () => {
      const base = {
        type: a.type, title: a.title, gameId: a.gameId || "", placeId: a.placeId || "", tableId: a.tableId || "",
        startAt: a.startAt, durationMin: a.durationMin, maxParticipants: a.maxParticipants || 0,
        invited: a.invited || [], declined: a.declined || [], notes: a.notes || "", reminderSent: !!a.reminderSent,
        updatedBy: S.uid, updatedAt: now(),
      };
      if (isNew) await addDoc(col("activities"), { ...base, createdBy: S.uid, participants: [S.uid], status: "GEPLAND" });
      else await setDoc(ref("activities", a.id), base, { merge: true });
    }, isNew ? "Ingepland" : "Opgeslagen");
  },
  async claimGuest(g) {
    await act(async () => {
      const b = writeBatch(db);
      const m = ref("members", S.uid);
      b.set(m, { guestId: g.id, name: g.name, hidden: false, replacedBy: "", updatedAt: now() }, { merge: true });
      if ((g.wants || []).length) b.update(m, { wants: arrayUnion(...g.wants) });
      b.update(ref("guests", g.id), { claimedBy: S.uid });
      const prev = me()?.guestId;
      if (prev && prev !== g.id) b.update(ref("guests", prev), { claimedBy: "" });
      if (g.claimedBy && g.claimedBy !== S.uid) {
        const old = await getDoc(ref("members", g.claimedBy));
        if (old.exists()) {
          const w = old.data().wants || [];
          if (w.length) b.update(m, { wants: arrayUnion(...w) });
          b.update(old.ref, { hidden: true, replacedBy: S.uid, guestId: "" });
        }
      }
      await b.commit();
    }, `Gekoppeld aan ${g.name}`);
  },
};

// ================================================================== matchmaking (zelfde regels als de app)
function matchmake() {
  const t = now();
  const running = S.activities.filter((a) => a.status === "GESTART");
  const busy = new Set(running.flatMap((a) => a.participants || []));
  const soon = S.activities.filter((a) => a.status === "GEPLAND" && a.startAt >= t - 15 * 60000 && a.startAt <= t + 60 * 60000);
  const occupied = new Set([...running, ...soon].map((a) => a.tableId).filter(Boolean));
  const free = S.tables.filter((x) => !occupied.has(x.id));
  const people = visibleMembers();
  const sugg = [], near = [];
  for (const g of S.games.filter((x) => !x.wishlist)) {
    const min = g.minPlayers || 2, max = g.maxPlayers || 4;
    const inter = people.filter((m) => (m.wants || []).includes(g.id) && m.status !== "BEZET" && !busy.has(m.id))
      .sort((a, b) => (a.status === "BESCHIKBAAR" ? 0 : 1) - (b.status === "BESCHIKBAAR" ? 0 : 1));
    if (inter.length >= min) {
      const players = inter.slice(0, Math.max(max, min));
      const table = free.filter((x) => (x.seats || 0) >= players.length).sort((a, b) => a.seats - b.seats)[0];
      const score = players.length / Math.max(max, 1) * 0.6 + players.filter((p) => p.status === "BESCHIKBAAR").length / players.length * 0.3 + (table ? 0.1 : 0);
      sugg.push({ g, players, table, score });
    } else if (inter.length && min - inter.length <= 2) near.push({ g, inter, missing: min - inter.length });
  }
  return { sugg: sugg.sort((a, b) => b.score - a.score), near: near.sort((a, b) => a.missing - b.missing), free };
}

// ================================================================== meldingen (zolang de app open is)
let prevActs = null;
const reminded = new Set(JSON.parse(store.get("app_reminded") || "[]"));
async function notify(title, body, tag) {
  toast(`${title} — ${body}`);
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  try {
    const reg = await navigator.serviceWorker?.getRegistration();
    if (reg) await reg.showNotification(title, { body, tag, icon: "icon-192.png", badge: "icon-192.png" });
    else new Notification(title, { body, tag, icon: "icon-192.png" });
  } catch {}
}
function checkChanges() {
  const cur = new Map(S.activities.map((a) => [a.id, a]));
  if (prevActs && S.uid) {
    for (const a of S.activities) {
      const p = prevActs.get(a.id);
      const involved = (a.participants || []).includes(S.uid) || (a.invited || []).includes(S.uid);
      const byOther = a.updatedBy && a.updatedBy !== S.uid;
      const where = whereText(a);
      if ((a.invited || []).includes(S.uid) && !(p?.invited || []).includes(S.uid) && isOpen(a))
        notify(`Uitnodiging: ${a.title}`, `${nameOf(a.createdBy)} nodigt je uit · ${dayLabel(a.startAt).toLowerCase()} ${fmtTime(a.startAt)}${where ? " · " + where : ""}`, a.id + "inv");
      if (p && involved && byOther && p.status !== a.status) {
        if (a.status === "GESTART") notify(`${a.title} begint nu!`, `Gestart door ${nameOf(a.updatedBy)}${where ? " · " + where : ""}`, a.id + "st");
        if (a.status === "GEANNULEERD") notify(`Geannuleerd: ${a.title}`, `${nameOf(a.updatedBy)} heeft het afgeblazen.`, a.id + "cx");
      }
      if (p && involved && byOther && a.status === "GEPLAND" && p.startAt !== a.startAt) { notify(`Nieuwe tijd: ${a.title}`, `${dayLabel(a.startAt).toLowerCase()} om ${fmtTime(a.startAt)}`, a.id + "tm"); reminded.delete(a.id); }
      if (p && a.createdBy === S.uid) {
        const joined = (a.participants || []).filter((x) => x !== S.uid && !(p.participants || []).includes(x));
        if (joined.length) notify(`${joined.map(nameOf).join(", ")} doet mee`, `${a.title} · ${(a.participants || []).length} deelnemers`, a.id + "jn");
      }
    }
  }
  prevActs = cur;
  checkReminders();
}
function checkReminders() {
  const t = now();
  for (const a of S.activities) {
    const involved = (a.participants || []).includes(S.uid) || (a.invited || []).includes(S.uid);
    const until = a.startAt - t;
    if (a.status === "GEPLAND" && involved && !reminded.has(a.id) && until > -5 * 60000 && until <= 20 * 60000) {
      reminded.add(a.id);
      const where = whereText(a);
      notify(`Zo meteen: ${a.title}`, `Om ${fmtTime(a.startAt)}${where ? " · " + where : ""}`, a.id + "rm");
    }
  }
  store.set("app_reminded", JSON.stringify([...reminded]));
}
setInterval(() => { if (S.event) { checkReminders(); presence(false); } }, 60000);

function presence(opened) {
  if (!S.uid || !S.eventId || !S.event) return;
  const ua = navigator.userAgent;
  const device = /iPhone/.test(ua) ? "iPhone" : /iPad/.test(ua) ? "iPad" : /Android/.test(ua) ? "Android (browser)" : /Mac/.test(ua) ? "Mac" : /Windows/.test(ua) ? "Windows" : "Browser";
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  setDoc(ref("members", S.uid), {
    platform: "webapp", appVersion: standalone ? "web-app (beginscherm)" : "web-app (browser)", device,
    notifications: "Notification" in window && Notification.permission === "granted",
    lastSeenAt: now(), ...(opened ? { lastOpenedAt: now() } : {}),
  }, { merge: true }).catch(() => {});
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") presence(true); });

// ================================================================== live data
function unsubscribe() { S.unsub.forEach((u) => u()); S.unsub = []; S.loaded.clear(); prevActs = null; }
function subscribe() {
  unsubscribe();
  S.unsub.push(onSnapshot(doc(db, "events", S.eventId), (d) => {
    if (!d.exists()) return leave();
    S.event = { id: d.id, ...d.data() }; S.loaded.add("event"); softRender();
  }, () => { toast("Geen toegang tot dit weekend"); leave(); }));
  for (const c of ["members", "games", "places", "tables", "activities", "rooms", "guests", "chores"]) {
    S.unsub.push(onSnapshot(col(c), (snap) => {
      S[c] = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      S.loaded.add(c);
      if (c === "activities" && S.loaded.has("members")) checkChanges();
      softRender();
    }));
  }
  setTimeout(() => presence(true), 1500);
}
function leave() { unsubscribe(); store.set("app_eventId", null); S.eventId = null; S.event = null; render(); }

// Niet opnieuw tekenen terwijl iemand typt of een venster open heeft
let pending = false;
const typing = () => { const a = document.activeElement; return a && (a.tagName === "TEXTAREA" || a.tagName === "SELECT" || (a.tagName === "INPUT" && !a.dataset.live)); };
function softRender() { if ($("#dlg").open || typing()) { pending = true; return; } pending = false; render(); }
document.addEventListener("focusout", () => setTimeout(() => { if (pending) softRender(); }, 60));
$("#dlg").addEventListener("close", () => { if (pending) softRender(); });

// ================================================================== weergaven
function activityCard(a) {
  const mine = (a.participants || []).includes(S.uid), inv = (a.invited || []).includes(S.uid);
  const cls = a.status === "GESTART" ? "running" : inv && isOpen(a) ? "invite" : "";
  const count = a.maxParticipants > 0 ? `${(a.participants || []).length}/${a.maxParticipants}` : `${(a.participants || []).length}`;
  const where = whereText(a);
  let buttons = "";
  if (isOpen(a)) {
    if (inv) buttons = `<button class="btn" data-a="yes" data-id="${a.id}">✓ Ik doe mee</button><button class="btn ghost" data-a="no" data-id="${a.id}">Nee, dank je</button>`;
    else if (!mine && !isFull(a)) buttons = `<button class="btn tonal" data-a="join" data-id="${a.id}">Doe mee</button>`;
    else if (mine) buttons = (a.status === "GEPLAND" || !a.status
      ? `<button class="btn" data-a="start" data-id="${a.id}">▶ Start</button>`
      : `<button class="btn" data-a="done" data-id="${a.id}">✓ Klaar</button>`) + `<button class="btn text" data-a="leave" data-id="${a.id}">Afmelden</button>`;
    else buttons = `<span class="pill">Vol</span>`;
  }
  return `<div class="card ${cls}">
    <div class="row" style="align-items:flex-start">
      <div style="font-size:24px">${(TYPES[a.type] || TYPES.ANDERS)[1]}</div>
      <div class="grow">
        <div class="title">${esc(a.title || (TYPES[a.type] || TYPES.ANDERS)[0])}</div>
        <div class="muted">${esc(dayLabel(a.startAt))} ${fmtTime(a.startAt)}–${fmtTime(endAt(a))}${where ? " · " + esc(where) : ""}</div>
        ${a.status && a.status !== "GEPLAND" ? `<div class="small" style="color:var(--brand);font-weight:600">${ASTATUS[a.status]}</div>` : ""}
      </div>
      <button class="btn text" data-a="menu" data-id="${a.id}" aria-label="Meer">⋯</button>
    </div>
    <div class="small" style="margin-top:6px">Doen mee (${count}): ${esc(names(a.participants) || "nog niemand")}</div>
    ${(a.invited || []).length ? `<div class="small muted">Uitgenodigd: ${esc(names(a.invited))}</div>` : ""}
    ${(a.declined || []).length ? `<div class="small muted">Afgemeld: ${esc(names(a.declined))}</div>` : ""}
    ${a.notes ? `<div class="small" style="margin-top:4px">${esc(a.notes)}</div>` : ""}
    ${buttons ? `<div class="row" style="margin-top:10px">${buttons}</div>` : ""}
  </div>`;
}

function claimView() {
  const all = [...S.guests].sort((a, b) => a.name.localeCompare(b.name, "nl"));
  const q = S.ui.claimQ.trim().toLowerCase();
  const shown = all.filter((g) => !q || g.name.toLowerCase().includes(q)).slice(0, q ? 12 : 6);
  return `<div class="card">
    <div class="title">Wie ben jij in de kamerindeling?</div>
    <p class="muted">Dan zie je je kamer en corvee, en komen de spellen waar je interesse in had op je ♥-lijst.</p>
    <input data-live="1" id="claimQ" placeholder="Zoek je naam" value="${esc(S.ui.claimQ)}">
    <div style="margin-top:6px">${shown.map((g) => `<div class="list-item ${S.ui.claimSel === g.id ? "sel" : ""}" data-claim="${g.id}">
      <span>${esc(g.name)}</span>${g.claimedBy && g.claimedBy !== S.uid ? `<span class="muted small">op ander toestel</span>` : ""}</div>`).join("")}
      ${!q && all.length > 6 ? `<p class="muted small">Typ een deel van je naam om te zoeken (${all.length} namen).</p>` : ""}
      ${q && !shown.length ? `<p class="muted small">Geen naam gevonden.</p>` : ""}
    </div>
    <button class="btn" id="claimGo" ${S.ui.claimSel ? "" : "disabled"} style="margin-top:8px">Koppelen</button>
  </div>`;
}

function stayView() {
  if (!S.guests.length) return "";
  if (!me()?.guestId || me()?.hidden) return claimView();
  const g = myGuest(); const room = S.rooms.find((r) => r.id === g?.roomId);
  const chores = S.chores.filter((c) => (c.names || []).includes(g?.name)).sort((a, b) => a.startAt - b.startAt);
  return `<div class="card">
    <div class="row"><span style="font-size:22px">🛏️</span><div class="grow">
      ${room ? `<div class="title">${esc(placeName(room.placeId))} · ${esc(room.name)}</div>
      <div class="muted">${room.floor}e verdieping${(room.occupants || []).filter((n) => n !== g.name).length ? " · met " + esc(room.occupants.filter((n) => n !== g.name).join(", ")) : ""}</div>`
      : `<div>Geen kamer gevonden voor ${esc(g?.name)}</div>`}
    </div></div>
    ${chores.length ? `<div class="row" style="margin-top:10px;align-items:flex-start"><span style="font-size:22px">🧽</span><div class="grow"><div class="small" style="font-weight:600">Jouw corvee</div>
      ${chores.map((c) => `<div class="small">${esc(c.day)} ${esc(c.slot)} ${esc(choreTimes(c))}${(c.names || []).filter((n) => n !== g.name).length ? " · met " + esc(c.names.filter((n) => n !== g.name).join(", ")) : ""}</div>`).join("")}</div></div>` : ""}
    <button class="btn text small" id="reclaim">Ben je iemand anders? Wijzig</button>
  </div>`;
}

function nuView() {
  const m = me() || {};
  const t = now();
  const invites = S.activities.filter((a) => (a.invited || []).includes(S.uid) && isOpen(a));
  const running = S.activities.filter((a) => a.status === "GESTART");
  const upcoming = S.activities.filter((a) => a.status === "GEPLAND" && endAt(a) >= t && !(a.invited || []).includes(S.uid)).sort((a, b) => a.startAt - b.startAt).slice(0, 6);
  const people = visibleMembers();
  const notifCard = "Notification" in window && Notification.permission === "default"
    ? `<div class="card row"><div class="grow small">Meldingen aanzetten voor uitnodigingen en de start van spellen (alleen als de app open is).</div><button class="btn tonal" id="notifOn">Aanzetten</button></div>` : "";
  const iosHint = /iPhone|iPad/.test(navigator.userAgent) && !(navigator.standalone === true) && !store.get("app_hideIos")
    ? `<div class="card"><div class="small"><b>Tip:</b> tik in Safari op <b>Deel</b> ⬆️ → <b>Zet op beginscherm</b>. Dan werkt dit als een echte app, met meldingen.</div><button class="btn text small" id="hideIos">Verbergen</button></div>` : "";
  return `${iosHint}
  <div class="card">
    <div class="title">Hoi ${esc(m.name || "")}, hoe sta je ervoor?</div>
    <div class="row" style="margin:10px 0 6px">${Object.entries(STATUS).map(([k, [l]]) => `<button class="chip ${m.status === k ? "on" : ""}" data-status="${k}">${dot(k)} ${l}</button>`).join("")}</div>
    <div class="muted small">${{ BESCHIKBAAR: "Je kunt direct aanschuiven.", RESERVEERBAAR: "Je bent vrij, maar wilt eerst gevraagd worden.", BEZET: "Je zit in een spel of bent even weg." }[m.status] || ""}</div>
    <div class="row" style="margin-top:8px"><input class="grow" id="note" maxlength="60" placeholder="Toelichting, bv. tot 15:00 vrij" value="${esc(m.statusNote || "")}" style="flex:1"><button class="btn tonal" id="noteSave">Opslaan</button></div>
  </div>
  ${stayView()}
  ${notifCard}
  <div class="row"><button class="btn tonal" id="planNew">+ Plan iets</button><button class="btn ghost" data-go="match">✨ Wat kan ik spelen?</button></div>
  ${invites.length ? `<h2>Uitnodigingen voor jou</h2>${invites.map(activityCard).join("")}` : ""}
  <h2>Nu bezig</h2>${running.length ? running.map(activityCard).join("") : `<p class="muted center">Er loopt nu niets.</p>`}
  <h2>Straks</h2>${upcoming.length ? upcoming.map(activityCard).join("") : `<p class="muted center">Nog niets gepland.</p>`}
  <h2>Wie is er (${people.length})</h2>
  ${Object.entries(STATUS).map(([k, [l]]) => { const grp = people.filter((p) => (p.status || "BESCHIKBAAR") === k).sort((a, b) => (a.name || "").localeCompare(b.name || "", "nl"));
    return grp.length ? `<div class="muted small" style="margin:8px 0 4px">${l} (${grp.length})</div><div>${grp.map((p) => `<span class="pill">${dot(k)} ${esc(p.name)}${p.statusNote ? ` <span class="muted small">· ${esc(p.statusNote)}</span>` : ""}</span>`).join("")}</div>` : ""; }).join("")}`;
}

function planningView() {
  const list = S.activities
    .filter((a) => !S.ui.plMine || (a.participants || []).includes(S.uid) || (a.invited || []).includes(S.uid))
    .filter((a) => S.ui.plDone || isOpen(a))
    .sort((a, b) => a.startAt - b.startAt);
  let out = `<div class="row" style="margin-bottom:8px">
    <button class="chip ${S.ui.plMine ? "on" : ""}" data-ui="plMine">Alleen van mij</button>
    <button class="chip ${S.ui.plDone ? "on" : ""}" data-ui="plDone">Ook afgelopen</button>
    <span class="grow"></span><button class="btn" id="planNew">+ Plannen</button></div>`;
  if (!list.length) out += `<p class="muted center">Niets gepland. Spellen, eten, een wandeling: tik op + Plannen.</p>`;
  let day = null;
  for (const a of list) {
    const d = startOfDay(a.startAt);
    if (d !== day) { day = d; out += `<h2>${esc(dayHeader(a.startAt))}</h2>`; }
    out += activityCard(a);
  }
  return out;
}

function gamesView() {
  const u = S.ui, wants = new Set(me()?.wants || []), mn = myName().toLowerCase();
  const claimedNames = new Set(S.guests.filter((g) => g.claimedBy).map((g) => g.name));
  const fans = {};
  visibleMembers().forEach((m) => (m.wants || []).forEach((gid) => (fans[gid] = fans[gid] || []).push(m.name)));
  const owners = [...new Set(S.games.filter((g) => !g.wishlist && g.owner).map((g) => g.owner.trim()))].sort((a, b) => a.localeCompare(b, "nl"));
  const cats = [...new Set(S.games.map((g) => g.category || "Overig"))].sort((a, b) => CATEGORIES.indexOf(a) - CATEGORIES.indexOf(b));
  const active = (u.gPlayers ? 1 : 0) + (u.gWeights.length ? 1 : 0) + (u.gCat ? 1 : 0) + (u.gOwner ? 1 : 0);
  const list = S.games
    .filter((g) => !u.gq || g.name.toLowerCase().includes(u.gq.toLowerCase()))
    .filter((g) => !u.gWant || wants.has(g.id))
    .filter((g) => !u.gMine || (g.owner || "").trim().toLowerCase() === mn)
    .filter((g) => !u.gWish || g.wishlist)
    .filter((g) => !u.gPlayers || (u.gPlayers >= 7 ? (g.maxPlayers || 0) >= 7 : u.gPlayers >= (g.minPlayers || 0) && u.gPlayers <= (g.maxPlayers || 99)))
    .filter((g) => !u.gWeights.length || u.gWeights.includes(g.weight))
    .filter((g) => !u.gCat || (g.category || "Overig") === u.gCat)
    .filter((g) => !u.gOwner || (g.owner || "").trim().toLowerCase() === u.gOwner.toLowerCase())
    .sort((a, b) => a.name.localeCompare(b.name, "nl"));
  const filters = u.gFilters ? `<div class="card">
    <div class="small" style="font-weight:600;margin-bottom:6px">Aantal spelers</div>
    <div class="row">${[0, 1, 2, 3, 4, 5, 6, 7].map((n) => `<button class="chip ${u.gPlayers === n ? "on" : ""}" data-players="${n}">${n === 0 ? "Alle" : n === 7 ? "7+" : n}</button>`).join("")}</div>
    <div class="small" style="font-weight:600;margin:10px 0 6px">Moeilijkheid</div>
    <div class="row">${Object.entries(WEIGHTS).map(([k, l]) => `<button class="chip ${u.gWeights.includes(k) ? "on" : ""}" data-weight="${k}">${l}</button>`).join("")}</div>
    <div class="grid2" style="margin-top:10px">
      <label class="f"><span>Categorie</span><select id="gCat"><option value="">Alle</option>${cats.map((c) => `<option ${u.gCat === c ? "selected" : ""}>${esc(c)}</option>`).join("")}</select></label>
      <label class="f"><span>Wie neemt het mee</span><select id="gOwner"><option value="">Iedereen</option>${owners.map((o) => `<option ${u.gOwner === o ? "selected" : ""}>${esc(o)}</option>`).join("")}</select></label>
    </div>
    ${active ? `<button class="btn text" id="gClear">Filters wissen</button>` : ""}
  </div>` : "";
  return `<input data-live="1" id="gq" placeholder="🔍 Zoek een spel" value="${esc(u.gq)}">
    <div class="row" style="margin:10px 0">
      ${mn ? `<button class="chip ${u.gMine ? "on" : ""}" data-ui="gMine">Neem ik mee</button>` : ""}
      <button class="chip ${u.gFilters || active ? "on" : ""}" data-ui="gFilters">Filters${active ? ` (${active})` : ""}</button>
      <button class="chip ${u.gWant ? "on" : ""}" data-ui="gWant">Mijn ♥ (${wants.size})</button>
      <button class="chip ${u.gWish ? "on" : ""}" data-ui="gWish">Wenslijst</button>
    </div>
    ${filters}
    <p class="muted small">${list.length} van ${S.games.length} spellen · tik op ♥ voor spellen die je wilt spelen — Match gebruikt dat.</p>
    ${list.map((g) => {
      const f = [...new Set([...(fans[g.id] || []), ...(g.interested || []).filter((n) => !claimedNames.has(n))])];
      return `<div class="card row" style="align-items:flex-start">
        <div class="grow">
          <div class="title">${esc(g.name)}</div>
          <div class="muted">${g.wishlist ? "Wenslijst · nog niemand neemt het mee" : g.owner ? "Neemt mee: " + esc(g.owner) : "Eigenaar onbekend"}</div>
          <div class="small ${g.infoChecked === false ? "warn" : "muted"}">${g.infoChecked === false ? "spelers/duur nog onbekend" : esc([`${g.minPlayers}–${g.maxPlayers} spelers`, `${g.durationMin} min`, WEIGHTS[g.weight], g.category].filter(Boolean).join(" · "))}</div>
          ${f.length ? `<div class="small" style="color:var(--accent);margin-top:2px">♥ ${esc(f.join(", "))}</div>` : ""}
        </div>
        ${g.link ? `<a href="${esc(g.link)}" target="_blank" rel="noopener" class="heart" style="font-size:18px;text-decoration:none" aria-label="BoardGameGeek">↗</a>` : ""}
        <button class="heart ${wants.has(g.id) ? "on" : ""}" data-want="${g.id}" aria-label="Wil ik spelen">${wants.has(g.id) ? "♥" : "♡"}</button>
      </div>`; }).join("")}`;
}

function matchView() {
  const r = matchmake();
  const m = me();
  return `<p class="muted">Op basis van ieders ♥-spellen, status (beschikbaar / reserveerbaar) en vrije tafels.</p>
    ${m?.status === "BEZET" ? `<div class="card">Je staat op Bezet, dus je telt nu niet mee in de suggesties.</div>` : ""}
    <h2>Kan nu gespeeld worden</h2>
    ${r.sugg.length ? r.sugg.map((s, i) => `<div class="card">
      <div class="title">${esc(s.g.name)}</div>
      <div class="muted">${s.players.length} van max. ${s.g.maxPlayers} · ${s.g.durationMin} min · ${s.table ? "vrij: " + esc(s.table.name) + (placeName(s.table.placeId) ? " (" + esc(placeName(s.table.placeId)) + ")" : "") : "geen vrije tafel"}</div>
      <div style="margin:8px 0">${s.players.map((p) => `<span class="pill">${dot(p.status)} ${esc(p.name)}</span>`).join("")}</div>
      <button class="btn" data-plan="${i}">📅 Plan en nodig uit</button></div>`).join("")
      : `<p class="muted center">${visibleMembers().every((x) => !(x.wants || []).length) ? "Nog niemand heeft spellen met ♥ gemarkeerd." : "Geen spel heeft nu genoeg vrije liefhebbers."}</p>`}
    ${r.near.length ? `<h2>Bijna — er mist nog iemand</h2>${r.near.map((n) => `<div class="card row"><div class="grow">
      <div class="title">${esc(n.g.name)}</div><div class="muted">Nog ${n.missing} speler${n.missing > 1 ? "s" : ""} nodig · ${esc(n.inter.map((x) => x.name).join(", "))}</div></div>
      ${(m?.wants || []).includes(n.g.id) ? "" : `<button class="btn ghost" data-want="${n.g.id}">♥ Ik wil ook</button>`}</div>`).join("")}` : ""}
    <h2>Vrije tafels</h2>
    ${S.tables.length ? (r.free.length ? `<div>${r.free.map((t) => `<span class="pill">${esc(t.name)} · ${t.seats} pl.${placeName(t.placeId) ? " · " + esc(placeName(t.placeId)) : ""}</span>`).join("")}</div>` : `<p class="muted">Alle tafels zijn bezet of komend uur gereserveerd.</p>`) : `<p class="muted">Nog geen tafels.</p>`}`;
}

function meerView() {
  const e = S.event || {};
  const slot = { ochtend: "Ochtend", middag: "Middag", avond: "Avond" };
  const DAYS = ["Vrijdag", "Zaterdag", "Zondag", "Maandag"];
  const roomsBy = {}; S.rooms.forEach((r) => (roomsBy[r.placeId] = roomsBy[r.placeId] || []).push(r));
  const choresBy = {}; S.chores.forEach((c) => (choresBy[c.placeId] = choresBy[c.placeId] || []).push(c));
  const mine = myGuest()?.name;
  return `<div class="card center" style="background:#fff"><img src="slimbo_logo.png" alt="Slimbo" style="max-width:260px;width:80%"></div>
    <div class="card">
      <div class="title">${esc(e.name)}</div>
      ${e.venue ? `<div>${esc(e.venue)}</div><div class="muted">${esc(e.address)}</div>` : ""}
      ${e.checkInAt ? `<div class="small" style="margin-top:6px">Inchecken ${esc(dayLabel(e.checkInAt).toLowerCase())} vanaf ${fmtTime(e.checkInAt)} · uitchecken ${esc(dayLabel(e.checkOutAt).toLowerCase())} tot ${fmtTime(e.checkOutAt)}</div>` : ""}
      <div class="row" style="margin-top:10px">
        ${e.address ? `<a class="btn tonal" style="text-decoration:none" target="_blank" rel="noopener" href="https://maps.google.com/?q=${encodeURIComponent(e.address)}">🗺️ Route</a>` : ""}
        ${e.phone ? `<a class="btn ghost" style="text-decoration:none" href="tel:${esc(e.phone.replace(/\s/g, ""))}">📞 Bellen</a>` : ""}
        <a class="btn ghost" style="text-decoration:none" target="_blank" rel="noopener" href="https://www.slimbo.nl/">slimbo.nl</a>
      </div>
    </div>
    <div class="card row"><div class="grow"><div class="muted small">Code om mee te doen</div><div style="font:700 26px ui-monospace,monospace">${esc(e.joinCode)}</div></div><button class="btn tonal" id="share">Delen</button></div>
    ${(e.info || []).map((s) => `<div class="card"><div class="title" style="font-size:16px">${esc(s.title)}</div>${(s.items || []).map((i) => `<div class="small" style="margin-top:4px">• ${esc(i)}</div>`).join("")}</div>`).join("")}
    ${Object.keys(roomsBy).length ? `<h2>Kamers</h2>${Object.entries(roomsBy).map(([pid, rs]) => `<div class="card"><div class="title" style="font-size:16px">${esc(placeName(pid))}</div>
      ${rs.sort((a, b) => a.floor - b.floor || a.name.localeCompare(b.name)).map((r) => `<div class="small" style="margin-top:6px;${(r.occupants || []).includes(mine) ? "font-weight:700;color:var(--brand)" : ""}">${esc(r.name)} · ${esc((r.occupants || []).join(", ") || "—")} <span class="muted">(${(r.occupants || []).length}/${r.beds})</span></div>`).join("")}</div>`).join("")}` : ""}
    ${Object.keys(choresBy).length ? `<h2>Corvee</h2>${Object.entries(choresBy).map(([pid, cs]) => `<div class="card"><div class="title" style="font-size:16px">${esc(placeName(pid))}</div>
      ${DAYS.filter((d) => cs.some((c) => c.day === d)).map((d) => `<div class="small" style="margin-top:8px;font-weight:600">${d}</div>${cs.filter((c) => c.day === d).sort((a, b) => a.startAt - b.startAt).map((c) => `<div class="small" style="${(c.names || []).includes(mine) ? "font-weight:700;color:var(--brand)" : ""}">${slot[c.slot] || c.slot} <span class="muted">${esc(choreTimes(c))}</span>: ${esc((c.names || []).join(", "))}</div>`).join("")}`).join("")}</div>`).join("")}` : ""}
    <div class="card"><label class="f"><span>Jouw naam</span><div class="row"><input id="myName" value="${esc(me()?.name || "")}" style="flex:1"><button class="btn tonal" id="nameSave">Opslaan</button></div></label></div>
    <button class="btn ghost" id="leave" style="margin:10px 0 30px">Ander weekend kiezen</button>`;
}

const TABS = [["nu", "Nu", "🏠"], ["planning", "Planning", "📅"], ["spellen", "Spellen", "🎲"], ["match", "Match", "✨"], ["meer", "Meer", "☰"]];

function render() {
  if (!S.uid) { $("#app").innerHTML = `<main><p class="muted center">Verbinden…</p></main>`; return; }
  if (!S.eventId) return renderLogin();
  if (!S.event || !S.loaded.has("members")) { $("#app").innerHTML = `<main><p class="muted center">Laden…</p></main>`; return; }
  if (!member(S.uid)) return renderLogin(); // nog geen lid (bijv. na wissen)
  const invites = S.activities.filter((a) => (a.invited || []).includes(S.uid) && isOpen(a)).length;
  const body = { nu: nuView, planning: planningView, spellen: gamesView, match: matchView, meer: meerView }[S.tab]();
  const scroll = window.scrollY, focusId = document.activeElement?.id, pos = document.activeElement?.selectionStart;
  $("#app").innerHTML = `<header><span class="logo"><img src="slimbo_logo.png" alt="Slimbo"></span><h1>${esc(S.event.name)}</h1></header>
    <main>${body}</main>
    <nav class="tabs">${TABS.map(([k, l, ic]) => `<button data-tab="${k}" class="${S.tab === k ? "on" : ""}"><span class="ic">${ic}</span>${l}${k === "nu" && invites ? `<span class="badge">${invites}</span>` : ""}</button>`).join("")}</nav>`;
  window.scrollTo(0, scroll);
  if (focusId && $("#" + focusId)) { const el = $("#" + focusId); el.focus(); try { el.setSelectionRange(pos, pos); } catch {} }
  bind();
}

function renderLogin() {
  $("#app").innerHTML = `<main><div class="login">
    <div class="logo"><img src="slimbo_logo.png" alt="Slimbo"></div>
    <div class="card">
      <div class="title">Meedoen met het spellenweekend</div>
      <p class="muted">Vul de code in die je van de organisatie hebt gekregen.</p>
      <label class="f"><span>Jouw naam</span><input id="lName" autocomplete="given-name" value="${esc(store.get("app_name") || "")}"></label>
      <label class="f"><span>Code van het weekend</span><input id="lCode" maxlength="6" autocapitalize="characters" style="text-transform:uppercase;letter-spacing:2px" value="${esc(store.get("app_code") || "")}"></label>
      <button class="btn" id="lGo" style="width:100%">Meedoen</button>
      <p class="muted small center" id="lMsg"></p>
    </div>
    <p class="center small"><a href="https://www.slimbo.nl/" target="_blank" rel="noopener">www.slimbo.nl</a></p>
  </div></main>`;
  $("#lGo").onclick = login;
}

async function login() {
  const name = $("#lName").value.trim(), code = $("#lCode").value.trim().toUpperCase();
  if (!name || code.length !== 6) { $("#lMsg").textContent = "Vul je naam en de code (6 tekens) in."; return; }
  $("#lMsg").textContent = "Bezig…";
  try {
    const snap = await getDocs(query(collection(db, "events"), where("joinCode", "==", code), limit(1)));
    if (snap.empty) { $("#lMsg").textContent = `Geen weekend gevonden met code ${code}.`; return; }
    const id = snap.docs[0].id;
    await setDoc(doc(db, "events", id, "members", S.uid), { name, status: "BESCHIKBAAR", updatedAt: now(), platform: "webapp" }, { merge: true });
    store.set("app_eventId", id); store.set("app_name", name); store.set("app_code", code);
    S.eventId = id; subscribe();
  } catch (e) { $("#lMsg").textContent = "Mislukt: " + e.message; }
}

// ================================================================== editor voor activiteiten
function openEditor(init) {
  const isNew = !init.id;
  const a = { type: "SPEL", title: "", startAt: roundedNow(), durationMin: 60, maxParticipants: 0, invited: [], declined: [], placeId: "", tableId: "", gameId: "", notes: "", participants: [], ...init };
  const dlg = $("#dlg");
  const days = []; for (let i = 0; i < 4; i++) days.push(startOfDay(now()) + i * 86400000);
  if (!days.includes(startOfDay(a.startAt))) days.unshift(startOfDay(a.startAt));
  const time = fmtTime(a.startAt);
  const others = visibleMembers().filter((m) => m.id !== S.uid).sort((x, y) => (x.name || "").localeCompare(y.name || "", "nl"));
  const games = [...S.games].sort((x, y) => x.name.localeCompare(y.name, "nl"));
  dlg.innerHTML = `<div class="dhead"><button class="btn text" id="eClose">✕</button><h3>${isNew ? "Nieuwe activiteit" : "Bewerken"}</h3><button class="btn" id="eSave">Opslaan</button></div>
  <div class="dbody">
    <div class="row" style="margin-bottom:10px">${Object.entries(TYPES).map(([k, [l, ic]]) => `<button class="chip ${a.type === k ? "on" : ""}" data-type="${k}">${ic} ${l}</button>`).join("")}</div>
    <label class="f" id="gameRow" style="${a.type === "SPEL" ? "" : "display:none"}"><span>Spel</span><select id="eGame"><option value="">Kies een spel…</option>${games.map((g) => `<option value="${g.id}" ${a.gameId === g.id ? "selected" : ""}>${esc(g.name)} (${g.minPlayers}–${g.maxPlayers})</option>`).join("")}</select></label>
    <label class="f"><span>Titel</span><input id="eTitle" value="${esc(a.title)}"></label>
    <div class="grid2">
      <label class="f"><span>Dag</span><select id="eDay">${days.map((d) => `<option value="${d}" ${startOfDay(a.startAt) === d ? "selected" : ""}>${esc(dayLabel(d))}</option>`).join("")}</select></label>
      <label class="f"><span>Tijd</span><input id="eTime" type="time" value="${time}"></label>
      <label class="f"><span>Duur (min)</span><input id="eDur" type="number" min="15" step="15" value="${a.durationMin}"></label>
      <label class="f"><span>Max. deelnemers (0 = geen)</span><input id="eMax" type="number" min="0" value="${a.maxParticipants}"></label>
      <label class="f"><span>Locatie</span><select id="ePlace"><option value="">—</option>${S.places.map((p) => `<option value="${p.id}" ${a.placeId === p.id ? "selected" : ""}>${esc(p.name)}</option>`).join("")}</select></label>
      <label class="f"><span>Tafel</span><select id="eTable"><option value="">—</option>${S.tables.map((t) => `<option value="${t.id}" ${a.tableId === t.id ? "selected" : ""}>${esc(t.name)} · ${t.seats} pl.${placeName(t.placeId) ? " · " + esc(placeName(t.placeId)) : ""}</option>`).join("")}</select></label>
    </div>
    <div class="small" style="font-weight:600;margin:8px 0 4px">Uitnodigen</div>
    ${others.length ? others.map((m) => { const joined = (a.participants || []).includes(m.id);
      return `<label class="check"><input type="checkbox" data-inv="${m.id}" ${joined || a.invited.includes(m.id) ? "checked" : ""} ${joined ? "disabled" : ""}>${dot(m.status)}<span class="grow">${esc(m.name)}<br><span class="muted small">${joined ? "doet al mee" : (STATUS[m.status] || STATUS.BESCHIKBAAR)[0] + (m.statusNote ? " · " + esc(m.statusNote) : "")}</span></span></label>`; }).join("")
      : `<p class="muted small">Nog niemand anders in de app.</p>`}
    <label class="f" style="margin-top:12px"><span>Notities</span><textarea id="eNotes">${esc(a.notes)}</textarea></label>
  </div>`;
  const defTitle = { ETEN: "Eten", WANDELEN: "Wandeling" };
  $$("[data-type]", dlg).forEach((b) => b.onclick = () => {
    const t = $("#eTitle"); if (!t.value || t.value === (defTitle[a.type] || "")) t.value = defTitle[b.dataset.type] || "";
    a.type = b.dataset.type; $$("[data-type]", dlg).forEach((x) => x.classList.toggle("on", x === b));
    $("#gameRow").style.display = a.type === "SPEL" ? "" : "none";
  });
  $("#eGame").onchange = () => { const g = S.games.find((x) => x.id === $("#eGame").value); if (g) { $("#eTitle").value = g.name; $("#eMax").value = g.maxPlayers; $("#eDur").value = g.durationMin; } };
  $("#eTable").onchange = () => { const t = S.tables.find((x) => x.id === $("#eTable").value); if (t?.placeId) $("#ePlace").value = t.placeId; };
  $("#eClose").onclick = () => dlg.close();
  $("#eSave").onclick = async () => {
    const title = $("#eTitle").value.trim();
    if (!title) { toast("Geef de activiteit een titel"); return; }
    const [h, mi] = ($("#eTime").value || "12:00").split(":").map(Number);
    const startAt = Number($("#eDay").value) + (h * 60 + mi) * 60000;
    const invited = $$("[data-inv]", dlg).filter((c) => c.checked && !c.disabled).map((c) => c.dataset.inv);
    const out = {
      ...a, type: a.type, title, gameId: a.type === "SPEL" ? $("#eGame").value : "", startAt,
      durationMin: parseInt($("#eDur").value || "60", 10), maxParticipants: parseInt($("#eMax").value || "0", 10),
      placeId: $("#ePlace").value, tableId: $("#eTable").value, invited,
      declined: (a.declined || []).filter((x) => !invited.includes(x)), notes: $("#eNotes").value.trim(),
      reminderSent: startAt !== a.startAt ? false : !!a.reminderSent,
    };
    dlg.close();
    await A.saveActivity(out, isNew);
  };
  dlg.showModal();
}

function openMenu(a) {
  const dlg = $("#dlg");
  dlg.innerHTML = `<div class="dhead"><button class="btn text" id="mClose">✕</button><h3>${esc(a.title)}</h3></div>
    <div class="dbody">
      <button class="btn tonal" id="mEdit" style="width:100%;margin-bottom:8px">Bewerken</button>
      ${isOpen(a) ? `<button class="btn ghost" id="mCancel" style="width:100%;margin-bottom:8px">Annuleren</button>` : `<button class="btn ghost" id="mReplan" style="width:100%;margin-bottom:8px">Opnieuw plannen</button>`}
      <button class="btn danger" id="mDel" style="width:100%">Verwijderen</button>
    </div>`;
  $("#mClose").onclick = () => dlg.close();
  $("#mEdit").onclick = () => { dlg.close(); openEditor(a); };
  if ($("#mCancel")) $("#mCancel").onclick = () => { dlg.close(); A.setActStatus(a, "GEANNULEERD"); };
  if ($("#mReplan")) $("#mReplan").onclick = () => { dlg.close(); A.setActStatus(a, "GEPLAND"); };
  $("#mDel").onclick = () => { if (confirm(`"${a.title}" voor iedereen verwijderen?`)) { dlg.close(); A.remove(a); } };
  dlg.showModal();
}

// ================================================================== events
function bind() {
  $$("[data-tab]").forEach((b) => b.onclick = () => { S.tab = b.dataset.tab; store.set("app_tab", S.tab); window.scrollTo(0, 0); render(); });
  $$("[data-go]").forEach((b) => b.onclick = () => { S.tab = b.dataset.go; store.set("app_tab", S.tab); window.scrollTo(0, 0); render(); });
  $$("[data-status]").forEach((b) => b.onclick = () => A.setStatus(b.dataset.status, $("#note")?.value || me()?.statusNote));
  if ($("#noteSave")) $("#noteSave").onclick = () => { A.setStatus(me()?.status || "BESCHIKBAAR", $("#note").value); $("#note").blur(); toast("Opgeslagen"); };
  if ($("#planNew")) $("#planNew").onclick = () => openEditor({});
  $$("[data-a]").forEach((b) => b.onclick = () => {
    const a = S.activities.find((x) => x.id === b.dataset.id); if (!a) return;
    ({ yes: () => A.respond(a, true), no: () => A.respond(a, false), join: () => A.join(a), leave: () => A.leave(a),
       start: () => A.setActStatus(a, "GESTART"), done: () => A.setActStatus(a, "AFGEROND"), menu: () => openMenu(a) })[b.dataset.a]();
  });
  $$("[data-ui]").forEach((b) => b.onclick = () => { S.ui[b.dataset.ui] = !S.ui[b.dataset.ui]; render(); });
  $$("[data-want]").forEach((b) => b.onclick = () => A.setWant(b.dataset.want, !(me()?.wants || []).includes(b.dataset.want)));
  $$("[data-players]").forEach((b) => b.onclick = () => { S.ui.gPlayers = Number(b.dataset.players); render(); });
  $$("[data-weight]").forEach((b) => b.onclick = () => { const w = b.dataset.weight; S.ui.gWeights = S.ui.gWeights.includes(w) ? S.ui.gWeights.filter((x) => x !== w) : [...S.ui.gWeights, w]; render(); });
  if ($("#gCat")) $("#gCat").onchange = (e) => { S.ui.gCat = e.target.value; e.target.blur(); render(); };
  if ($("#gOwner")) $("#gOwner").onchange = (e) => { S.ui.gOwner = e.target.value; e.target.blur(); render(); };
  if ($("#gClear")) $("#gClear").onclick = () => { Object.assign(S.ui, { gPlayers: 0, gWeights: [], gCat: "", gOwner: "" }); render(); };
  if ($("#gq")) $("#gq").oninput = (e) => { S.ui.gq = e.target.value; render(); };
  if ($("#claimQ")) $("#claimQ").oninput = (e) => { S.ui.claimQ = e.target.value; render(); };
  $$("[data-claim]").forEach((el) => el.onclick = () => { S.ui.claimSel = el.dataset.claim; render(); });
  if ($("#claimGo")) $("#claimGo").onclick = () => {
    const g = S.guests.find((x) => x.id === S.ui.claimSel); if (!g) return;
    if (g.claimedBy && g.claimedBy !== S.uid && !confirm(`${g.name} is al gekoppeld aan een ander toestel (bijv. na opnieuw installeren). Overnemen? Je ♥'s gaan mee.`)) return;
    A.claimGuest(g); S.ui.claimSel = ""; S.ui.claimQ = "";
  };
  if ($("#reclaim")) $("#reclaim").onclick = () => act(() => updateDoc(ref("members", S.uid), { guestId: "" }));
  if ($("#notifOn")) $("#notifOn").onclick = async () => { try { await Notification.requestPermission(); } catch {} presence(false); render(); };
  if ($("#hideIos")) $("#hideIos").onclick = () => { store.set("app_hideIos", "1"); render(); };
  $$("[data-plan]").forEach((b) => b.onclick = () => {
    const s = matchmake().sugg[Number(b.dataset.plan)]; if (!s) return;
    openEditor({ type: "SPEL", title: s.g.name, gameId: s.g.id, durationMin: s.g.durationMin || 60, maxParticipants: s.g.maxPlayers || 0,
      tableId: s.table?.id || "", placeId: s.table?.placeId || "", invited: s.players.map((p) => p.id).filter((x) => x !== S.uid) });
  });
  if ($("#share")) $("#share").onclick = async () => {
    const text = `Doe mee met "${S.event.name}": ${location.href.split("#")[0]} — code ${S.event.joinCode}`;
    try { if (navigator.share) await navigator.share({ text }); else { await navigator.clipboard.writeText(text); toast("Gekopieerd"); } } catch {}
  };
  if ($("#nameSave")) $("#nameSave").onclick = () => act(() => updateDoc(ref("members", S.uid), { name: $("#myName").value.trim() }), "Naam opgeslagen");
  if ($("#leave")) $("#leave").onclick = () => { if (confirm("Ander weekend kiezen? Je kunt met dezelfde code terugkomen.")) leave(); };
}

// ================================================================== start
onAuthStateChanged(auth, (u) => {
  if (!u) { signInAnonymously(auth).catch((e) => { $("#app").innerHTML = `<main><div class="card">Verbinden mislukt: ${esc(e.message)}</div></main>`; }); return; }
  S.uid = u.uid;
  if (S.eventId) subscribe(); else render();
});
render();
</script>
