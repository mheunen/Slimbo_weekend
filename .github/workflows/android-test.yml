name: Android unit-tests

on:
  pull_request:
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/android-test.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # De unit-tests hebben geen echte Firebase nodig; de plugin wil alleen een geldig bestand.
      - name: Dummy google-services.json plaatsen
        run: cp .github/google-services.test.json app/google-services.json

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit-tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon --stacktrace
