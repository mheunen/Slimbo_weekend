name: Website

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Zonder secret (bijv. een fork) wordt de site niet gepubliceerd
      - name: Site samenstellen
        id: site
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::notice::Secret GOOGLE_SERVICES_JSON ontbreekt: site niet gepubliceerd. Zie README, stap 4."
            exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"
          mkdir -p _site
          cp -r web/. _site/
          python3 - <<'PY'
          import json, os
          gs = json.loads(os.environ["GOOGLE_SERVICES_JSON"])
          info = gs["project_info"]
          cfg = {
              "apiKey": gs["client"][0]["api_key"][0]["current_key"],
              "projectId": info["project_id"],
              "authDomain": f'{info["project_id"]}.firebaseapp.com',
              "storageBucket": info.get("storage_bucket", ""),
              "messagingSenderId": info.get("project_number", ""),
          }
          open("_site/config.js", "w").write("window.FIREBASE_CONFIG = " + json.dumps(cfg) + ";\n")
          PY

      - uses: actions/configure-pages@v5
        if: steps.site.outputs.ok == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.site.outputs.ok == 'true'
        with:
          path: _site
      - id: deployment
        if: steps.site.outputs.ok == 'true'
        uses: actions/deploy-pages@v4
