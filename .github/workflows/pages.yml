name: Website

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "app/src/main/assets/seed_*.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Site samenstellen
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p _site
          cp -r web/. _site/
          cp app/src/main/assets/seed_medael_2026.json _site/seed.json
          python3 - <<'PY'
          import json, os
          gs = json.loads(os.environ["GOOGLE_SERVICES_JSON"])
          info = gs["project_info"]
          cfg = {
              "apiKey": gs["client"][0]["api_key"][0]["current_key"],
              "projectId": info["project_id"],
              "authDomain": f'{info["project_id"]}.firebaseapp.com',
              "storageBucket": info.get("storage_bucket", ""),
              "messagingSenderId": info.get("project_number", ""),
          }
          open("_site/config.js", "w").write("window.FIREBASE_CONFIG = " + json.dumps(cfg) + ";\n")
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
