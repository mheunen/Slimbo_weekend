name: "Beheer: deelnemers kopiëren"

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Code van het weekend waar de deelnemers bij komen"
        default: "J7A3V5"
      source:
        description: "Code van het weekend waar de spellen vandaan komen"
        default: "3GQ4B9"
      names:
        description: "Voornamen, komma-gescheiden"
        default: ""
      apply:
        description: "1 = echt schrijven, leeg = alleen proef"
        default: ""
      task:
        description: "copy = deelnemers/spellen kopiëren, wishes = wensen zonder ♥ verwijderen"
        default: "copy"
      prune:
        description: "1 = spellen van niet-deelnemers en wensen uit het doelweekend verwijderen"
        default: ""

permissions:
  contents: read

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Deelnemers en spellen kopiëren
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          TARGET_CODE: ${{ github.event.inputs.target }}
          SOURCE_CODE: ${{ github.event.inputs.source }}
          NAMES: ${{ github.event.inputs.names }}
          APPLY: ${{ github.event.inputs.apply }}
          PRUNE: ${{ github.event.inputs.prune }}
          CODE: ${{ github.event.inputs.target }}
          TASK: ${{ github.event.inputs.task }}
        run: |
          if [ "$TASK" = "wishes" ]; then python3 tools/prune_wishes.py; else python3 tools/copy_people.py; fi
